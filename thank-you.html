<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | {{BUSINESS_NAME}}</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png?v=3">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,sans-serif;background:linear-gradient(160deg,#072b19,#0f4d2d);color:#fff;padding:20px;box-sizing:border-box}
  .box{max-width:520px;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:44px 30px}
  .mark{width:60px;height:60px;border-radius:50%;background:#c9a13b;color:#072b19;display:grid;place-items:center;font-size:1.8rem;font-weight:700;margin:0 auto 18px}
  h1{font-family:Fraunces,serif;margin:0 0 12px;font-size:2rem}
  p{color:#cfd7e6;line-height:1.6}
  a{display:inline-block;margin-top:20px;background:#c9a13b;color:#072b19;text-decoration:none;font-weight:600;padding:13px 26px;border-radius:999px}
</style>
</head>
<body>
  <div class="box">
    <img src="img/logo-services-dark-v2.webp" alt="{{BUSINESS_NAME}}" style="height:90px;margin:0 auto 20px;display:block">
    <h1>Thank you!</h1>
    <p id="tyMsg">We got your information. Someone from the {{BUSINESS_NAME}} team will reach out within one business day.</p>
    <script>(function(){var m=location.search.match(/[?&]ero=([^&]+)/);if(!m)return;var n=decodeURIComponent(m[1].replace(/\+/g," ")).replace(/[<>]/g,"").slice(0,120);document.getElementById("tyMsg").textContent="We got your application and let "+n+" know. They will contact you about their team agreement and next steps.";var t=document.createElement("p");t.innerHTML="Need training? Your ERO may ask you to complete {{SHORT_NAME}}\u2019s Tax Academy ($99 for all 8 courses).";document.getElementById("tyMsg").after(t);var a=document.querySelector(".box > a");if(a){a.href="/academy.html";a.textContent="See the Tax Academy";}})();</script>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
